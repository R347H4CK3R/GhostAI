name: Verify and package iPhone prototype
on:
  workflow_dispatch:
  push:
    branches: [main, feature/paired-execution-protocol]
  pull_request:
permissions:
  contents: read
jobs:
  desktop-companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r companion/requirements-pairing.txt
      - run: python -m unittest discover -s companion/tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AsterionVeyra-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  # Extra native diagnostics only. Packaging still requires the full ios job.
  ios-pairing-tls-preflight:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot test simulator
        timeout-minutes: 6
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; ds=json.load(sys.stdin)["devices"]; keys=sorted((k for k in ds if "iOS-26" in k), key=lambda k: tuple(map(int,re.findall(r"[0-9]+",k))), reverse=True); print(next(d["udid"] for k in keys for d in ds[k] if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Pairing TLS policy tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -only-testing:AsterionVeyraTests/PairedDesktopTransportTests -resultBundlePath PairingTLSResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee pairing-tls-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterionVeyra-pairing-TLS-preflight
          path: |
            PairingTLSResults.xcresult
            pairing-tls-tests.log
          if-no-files-found: ignore
  ios:
    needs: desktop-companion
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Verify app icon source
        run: |
          python3 scripts/verify_app_icon.py
          python3 -m unittest discover -s scripts/tests -v
      - run: xcodegen generate
      - name: Boot owned test simulator
        timeout-minutes: 6
        run: python3 scripts/ci_simulator.py boot --output test-simulator --github-env "$GITHUB_ENV"
      # Match the release workflow: compile first, then run every test with the
      # unchanged suite/per-test limits. Compilation must not consume UI test time.
      - name: Compile simulator test bundles
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee simulator-build.log
      - name: Reduced checklist lifecycle controls
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath simulator-build -only-testing:AsterionVeyraTests/ChecklistLifecycleFixtureTests -only-testing:AsterionVeyraUITests/ChecklistLifecycleUITests -resultBundlePath ChecklistLifecycleResults.xcresult CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee checklist-lifecycle-tests.log
      - name: Checklist interaction regressions
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath simulator-build -only-testing:AsterionVeyraUITests/AssistantUITests/testChecklistEditorSurvivesBackgroundWithoutVoiceRequest -only-testing:AsterionVeyraUITests/AssistantUITests/testVoiceRequestWaitsForChecklistCancelWithoutSavingDraft -only-testing:AsterionVeyraUITests/AssistantUITests/testVoiceRequestWaitsForChecklistSaveWithoutLosingDraft -only-testing:AsterionVeyraUITests/AssistantUITests/testVoiceRequestWaitsForInteractiveChecklistDismissalWithoutSavingDraft -resultBundlePath ChecklistInteractionResults.xcresult CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee checklist-interaction-tests.log
      - name: Unit tests
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath simulator-build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee xcode-tests.log
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-screenshots || true
          fi
          if [ -d ChecklistLifecycleResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ChecklistLifecycleResults.xcresult --output-path checklist-lifecycle-screenshots || true
          fi
          if [ -d ChecklistInteractionResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ChecklistInteractionResults.xcresult --output-path checklist-test-screenshots || true
          fi
      - name: Verify encrypted Swift-to-desktop transfer
        if: success()
        run: |
          python3 -m venv .verification-venv
          .verification-venv/bin/python -m pip install -r companion/requirements-sync.txt
          .verification-venv/bin/python Tests/verify_mobile_transfer.py test-screenshots
          .verification-venv/bin/python -m unittest scripts.tests.test_private_memory_sync_reference -v
      - name: Shut down owned test simulator before upgrade
        if: ${{ always() && env.SIMULATOR_ID != '' }}
        timeout-minutes: 2
        run: python3 scripts/ci_simulator.py shutdown --output test-simulator --simulator-id "$SIMULATOR_ID"
      - name: Verify install-over-existing simulator upgrade
        timeout-minutes: 20
        run: python3 scripts/verify_simulator_upgrade.py --output upgrade-results --budget-seconds 1080
      - name: Upload simulator upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterionVeyra-simulator-upgrade
          path: upgrade-results
          if-no-files-found: ignore
      - name: Compile unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AsterionVeyra.app Payload/
          zip -qr AsterionVeyra-unsigned.ipa Payload
          unzip -t AsterionVeyra-unsigned.ipa
          python3 scripts/verify_app_icon.py --ipa AsterionVeyra-unsigned.ipa --asset-info-output app-icon-assets.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterionVeyra-unsigned-IPA
          path: AsterionVeyra-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterionVeyra-iOS-test-results
          path: |
            TestResults.xcresult
            ChecklistLifecycleResults.xcresult
            checklist-lifecycle-tests.log
            checklist-lifecycle-screenshots
            ChecklistInteractionResults.xcresult
            checklist-interaction-tests.log
            checklist-test-screenshots
            xcode-tests.log
            simulator-build.log
            test-screenshots
            app-icon-assets.json
            test-simulator
          if-no-files-found: ignore

name: Verify and package iPhone prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop-companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r companion/requirements-sync.txt
      - run: python -m unittest discover -s companion/tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build Android debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AsterionVeyra-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    needs: desktop-companion
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE" || { echo 'Xcode 26 is required'; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot test simulator
        timeout-minutes: 6
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,re; ds=json.load(sys.stdin)["devices"]; keys=sorted((k for k in ds if "iOS-26" in k), key=lambda k: tuple(map(int,re.findall(r"[0-9]+",k))), reverse=True); print(next(d["udid"] for k in keys for d in ds[k] if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Unit tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcode-tests.log
      - name: Compile unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project AsterionVeyra.xcodeproj -scheme AsterionVeyra -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AsterionVeyra.app Payload/
          zip -qr AsterionVeyra-unsigned.ipa Payload
          unzip -t AsterionVeyra-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AsterionVeyra-unsigned-IPA
          path: AsterionVeyra-unsigned.ipa
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterionVeyra-iOS-test-results
          path: |
            TestResults.xcresult
            xcode-tests.log
            test-screenshots
          if-no-files-found: ignore

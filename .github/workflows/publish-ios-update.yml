name: Publish verified SideStore update
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful iOS workflow run ID from feature/paired-execution-protocol
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sidestore-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'R347H4CK3R/GhostAI' && github.ref == 'refs/heads/feature/paired-execution-protocol'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication policy
        run: python -m unittest discover -s scripts/tests -p 'test_publish_ios_update.py' -v
      - name: Publish existing verified IPA
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_RUN_ID: ${{ inputs.run_id }}
        run: python scripts/publish_ios_update.py
